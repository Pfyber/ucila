name: 💡 Nova ideja za učilo / Nova ideja / New aid idea
description: Imaš idejo ali že narejeno učilo? Povej nam. / Have an idea or a finished aid? Tell us.
title: "[Ideja] "
labels: ["new-aid"]
body:
  - type: markdown
    attributes:
      value: |
        Izpolnjeno predlogo (.zip) povleci v polje spodaj. Predloga: https://pfyber.github.io/ucila/predloga-ucila.zip
        Popunjen šablon (.zip) prevuci u polje ispod.
        Drag your filled-in template (.zip) into the box below.
  - type: input
    id: name
    attributes:
      label: Ime učila / Naziv / Name
    validations:
      required: true
  - type: textarea
    id: lesson
    attributes:
      label: Kaj učenci s tem počnejo? / Šta učenici rade? / What do pupils do with it?
      description: Če si poslal/a predlogo, lahko pustiš prazno. / Leave empty if you sent the template.
  - type: dropdown
    id: machine
    attributes:
      label: Izdelava / Izrada / Method
      multiple: true
      options: [laser, 3d-print, cnc, hand-tools, electronics]
  - type: textarea
    id: files
    attributes:
      label: Datoteke / Fajlovi / Files
      description: Povleci sem .zip s predlogo ali posamezne datoteke. / Drag the template .zip or single files here.
