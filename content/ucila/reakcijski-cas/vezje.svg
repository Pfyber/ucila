<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="120mm" viewBox="0 0 200 120">
  <title>ESP32 reaction-time game - wiring</title>
  <desc>LED on GPIO 2 via 220 ohm resistor, push button between GPIO 15 and GND (internal pull-up).</desc>
  <style>text{font-family:sans-serif;font-size:4px} .w{fill:none;stroke-width:1}</style>
  <rect x="10" y="20" width="60" height="80" rx="3" fill="#222"/>
  <text x="40" y="60" fill="#fff" text-anchor="middle">ESP32</text>
  <text x="72" y="36">GPIO 2</text>
  <text x="72" y="66">GPIO 15</text>
  <text x="72" y="96">GND</text>
  <path class="w" stroke="#2a9d8f" d="M70 34 H110"/>
  <rect x="110" y="31" width="20" height="6" fill="#f4e1b5" stroke="#333" stroke-width=".5"/>
  <text x="112" y="29">220 ohm</text>
  <path class="w" stroke="#2a9d8f" d="M130 34 H150"/>
  <path d="M150 28 L150 40 L160 34 Z" fill="#e63946"/>
  <path class="w" stroke="#333" d="M160 28 V40"/>
  <text x="148" y="24">LED</text>
  <path class="w" stroke="#333" d="M160 34 H185 V94 H70"/>
  <path class="w" stroke="#e76f51" d="M70 64 H120"/>
  <circle cx="122" cy="64" r="2" fill="#333"/>
  <path class="w" stroke="#333" d="M124 60 L136 60"/>
  <circle cx="138" cy="64" r="2" fill="#333"/>
  <text x="120" y="56">Button</text>
  <path class="w" stroke="#333" d="M140 64 H185"/>
</svg>
